# Example Factorio dashboard (a "sections" view) laid out like the AB-1 mockup:
# header and system map, planets with players on their right, the last hour.
#
# Replace `main` with your server id (the relay's FHA_SERVER_ID) in every `server_id: main`.
# All cards come with the integration. Install the theme from examples/themes first (see README).
title: Factorio
views:
  - title: Factorio
    path: factorio
    icon: mdi:factory
    type: sections
    theme: factorio
    max_columns: 4
    sections:
      # Header and map: full width
      - type: grid
        column_span: 4
        cards:
          - type: custom:factorio-header-card
            server_id: main
          - type: custom:factorio-map-card
            server_id: main
            height: 640        # 360-1200
            label_healthy: true

      # Planets: three columns
      - type: grid
        column_span: 3
        cards:
          - type: custom:factorio-planets-card
            server_id: main

      # Players: the fourth column
      - type: grid
        column_span: 1
        cards:
          - type: custom:factorio-players-card
            server_id: main

      # Last hour: full width
      - type: grid
        column_span: 4
        cards:
          - type: custom:factorio-timeline-card
            server_id: main
            window_minutes: 60  # 5-60
