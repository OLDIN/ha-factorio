name: Release

# Publishes a GitHub Release whenever a merged PR changes the version in
# manifest.json. Same steps as `python scripts/bump_version.py release`,
# which stays available as a manual fallback.

on:
  push:
    branches: [main]
    paths:
      - custom_components/factorio/manifest.json
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish release
    # Manual runs from other branches must not publish unmerged code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(jq -r .version custom_components/factorio/manifest.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version in manifest.json: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check tag and release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Checked separately, so a run that pushed the tag but failed to
          # create the release is finished by the next run.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "tag=true" >> "$GITHUB_OUTPUT"
            tagged=$(git rev-parse "$TAG^{commit}")
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::notice::$TAG already points to ${tagged:0:7}; the release (if missing) is created for that commit"
            fi
          else
            echo "tag=false" >> "$GITHUB_OUTPUT"
          fi
          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            # A release without the HACS zip (e.g. an interrupted run) is finished too.
            if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -x 'factorio.zip' > /dev/null; then
              echo "::notice::$TAG is already released with factorio.zip, nothing to do"
              echo "asset=true" >> "$GITHUB_OUTPUT"
            else
              echo "asset=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "asset=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.check.outputs.tag == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "refs/tags/$TAG"

      - name: Set up Node
        if: steps.check.outputs.asset == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build card bundle
        if: steps.check.outputs.asset == 'false'
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Package integration for HACS
        if: steps.check.outputs.asset == 'false'
        run: |
          test -f custom_components/factorio/www/factorio-cards.js
          # HACS unpacks the zip straight into custom_components/factorio:
          # zip the contents, not the folder.
          (cd custom_components/factorio && zip -r -X "$GITHUB_WORKSPACE/factorio.zip" . -x '__pycache__/*' '*/__pycache__/*' '*.pyc')

      - name: Create GitHub Release
        if: steps.check.outputs.release == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="RELEASE_NOTES_${VERSION}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes"
          else
            echo "::warning::$notes not found, using GitHub-generated notes"
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
          echo "### Released [$TAG](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HACS zip
        # Also repairs an existing release that lacks the asset; --clobber makes a re-run safe.
        if: steps.check.outputs.asset == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload "$TAG" factorio.zip --clobber
